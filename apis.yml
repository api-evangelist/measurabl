aid: measurabl
name: Measurabl
description: >-
  Measurabl is an ESG (environmental, social and governance) data and sustainability management
  platform for commercial real estate, used by owners, investors, asset managers and capital-markets
  participants to measure, manage, report and act on building performance data. The platform covers
  utility and waste data collection, carbon accounting, green building certifications and ratings,
  local performance ordinance compliance, CRREM transition-risk analysis, and portfolio and
  fund-level ESG reporting. Measurabl exposes this through a REST API surface documented in Swagger
  UI at api.measurabl.com: a Core API for reading and writing portfolios, buildings, spaces, funds,
  energy/water meters and readings, waste meters, certifications and ratings; an ESGx Buildings
  (Insights) API for asset-level energy and carbon estimates, certification and ordinance lookups,
  CRREM lookups and bulk exports; ESGx Securities and ESGx Securities Compliance Files APIs for
  listed real estate company-level and building-level datasets; and a Partner API for partner-side
  portfolio, building and monthly utility data access. Every API is OpenAPI 3.0.1, secured with
  OAuth 2.0 client credentials, and returns JSON:API (application/vnd.api+json) documents.
