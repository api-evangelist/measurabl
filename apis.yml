apis:
- name: Measurabl Core API
  description: >-
    Read and write the ESG data core of the Measurabl platform: portfolios, buildings, spaces,
    funds, energy and water meters and their readings and bills, waste meters and readings, green
    building certifications and certification types, and ratings (including space-level
    certifications and ratings). JSON:API over OAuth 2.0 client credentials; 57 operations across
    32 paths.
  humanURL: https://api.measurabl.com/api-docs/index.html?urls.primaryName=Measurabl+Core+API+Docs
  baseURL: https://api.measurabl.com/core/v0
