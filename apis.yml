- name: Measurabl ESGx Buildings API
  description: >-
    Asset-level building intelligence (the Insights surface): submit buildings by coordinates,
    address or Measurabl building id and receive modeled energy estimates, carbon estimates, green
    building certification lookups, local performance ordinance lookups and CRREM transition-risk
    lookups, individually or as asynchronous batches with CSV upload and bulk export/download.
  humanURL: https://api.measurabl.com/api-docs/index.html?urls.primaryName=ESGx+Buildings+V0+Docs
  baseURL: https://api.measurabl.com/insights/v0
