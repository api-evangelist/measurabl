  /insights/v0/energy_estimate_batches/upload:
    post:
      summary: Uploads a file to create new energy estimate(s)
      description: 'Upload an Excel file of energy estimate records to be processed. The response will include the estimate
        batch record, including the ID that can be used to access the estimate batch or its energy estimates.

        '
      tags:
      - Energy Estimates
      security:
      - OAuth2: []
      parameters:
      - name: timePeriod
        in: query
        schema:
          type: string
          description: 'A timePeriod to apply for all estimates in the batch. The valid values for timePeriod are: ["T-12",
            "2025", "2024", "2023", "2022", "2021"]''

            '
          enum:
          - T-12
          - '2025'
          - '2024'
          - '2023'
          - '2022'
          - '2021'
        required: true
      responses:
        '200':
          description: Energy estimate batch successfully created
          content:
            application/vnd.api+json:
              example:
                data:
                  id: 5503b9b5-2dba-4d98-948b-2aab07e9b30e
                  type: energyEstimateBatches
                  attributes:
                    estimateType: energy
                    status: STARTING
                    timePeriod: '2025'
                    errorMessage: null
                    createdAt: '2026-07-16T13:22:09.957Z'
                    updatedAt: '2026-07-16T13:22:09.967Z'
              schema:
                $ref: '#/components/schemas/json_api'
        '400':
          description: invalid time period
          content:
            application/vnd.api+json:
              example:
                errors:
                - status: '400'
                  title: Bad Request
                  detail: 'Time period requested: 3023 is not included in the list T-12, 2025, 2024, 2023, 2022, 2021; Requesting
                    app: Spencer, Gerhold and Beahan'
              schema:
                $ref: '#/components/schemas/json_api'
        '403':
          description: unauthorized request
          content:
            application/vnd.api+json:
              example:
                errors:
                - status: '403'
                  title: Forbidden
                  detail: 'A valid auth token is required.

                    POST to ''/token'' with a valid ''key'' and ''secret'' to get an auth token.

                    '
              schema:
                $ref: '#/components/schemas/json_api'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                estimate_batch_file:
                  type: string
                  format: binary
                  description: 'An Excel XLSX file containing the buildings you would like energy estimates for.


                    <br>

                    When requesting data on buildings for the first time, the Excel Worksheet must be named ''Buildings''.


                    <br>

                    Building information is required for each estimate. Other fields are optional.


                    The field ''clientMetadata'' is available for storing arbitrary JSON, this allows storing identifiers
                    from your system and other metadata as part of the energy estimate record.


                    <br>

                    When requesting data on existing buildings i.e. you have the Building IDs, the Excel Worksheet must be
                    named ''MSR Building IDs'' and may only contain a single column named ''MSR Building ID''.


                    '
        required: true
