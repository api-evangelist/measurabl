                    updatedAt: '2026-07-16T13:21:00.138Z'
              schema:
                $ref: '#/components/schemas/json_api'
        '400':
          description: missing file upload
          content:
            application/vnd.api+json:
              example:
                errors:
                - status: '400'
                  title: Bad Request
                  detail: 'Excel file required in certification_lookup_batch_file

                    '
              schema:
                $ref: '#/components/schemas/json_api'
        '403':
          description: unauthorized request
          content:
            application/vnd.api+json:
              example:
                errors:
                - status: '403'
                  title: Forbidden
                  detail: 'A valid auth token is required.

                    POST to ''/token'' with a valid ''key'' and ''secret'' to get an auth token.

                    '
              schema:
                $ref: '#/components/schemas/json_api'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                certification_lookup_batch_file:
                  type: string
                  format: binary
                  description: 'An Excel XLSX file containing the buildings you would like certification lookups for.


                    <br>

                    When requesting data on buildings for the first time, the Excel Worksheet must be named ''Buildings''.


                    <br>

                    Building information is required for each certification lookup. Other fields are optional.


                    The field ''clientMetadata'' is available for storing arbitrary JSON, this allows storing identifiers
                    from your system and other metadata as part of the certification lookup record.


                    <br>

                    When requesting data on existing buildings i.e. you have the Building IDs, the Excel Worksheet must be
                    named ''MSR Building IDs'' and may only contain a single column named ''MSR Building ID''.


                    '
        required: true
