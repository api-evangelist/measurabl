            application/vnd.api+json:
              example:
                data:
                - id: 07911585-8dae-442e-bfc5-5537568bef75
                  type: spaces
                  attributes:
                    propertyType: Financial Office
                    name: Office B
                    common: true
                    floorAreaSqFt: 9791
                    allocation: 25
                    estarSpaceId: 39613944
                    customized: false
                  relationships:
