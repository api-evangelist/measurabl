                    createdAt: '2026-07-16T13:22:14.228Z'
                    updatedAt: '2026-07-16T13:22:14.231Z'
                    permalink: http://localhost:3000/insights/v0/exports/50212abd-5e0f-4349-b6d6-947f26abac0c/download
