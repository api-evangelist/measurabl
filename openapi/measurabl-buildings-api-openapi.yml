                    addressCountry: United States
                    yearBuilt: 1980
                    buildingClass: C
                    primaryPropertyType: Data Center
                    floorAreaSqFt: 20000.0
                    customId: null
                    boughtDate: '2026-03-29'
                    soldDate: null
                    isSingleTenant: false
                    percentOwned: 80.0
                    isActive: false
        required: true
        description: Request body used to create a building associated with a portfolio
